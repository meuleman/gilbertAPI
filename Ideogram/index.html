<!DOCTYPE html>
<html>
<head>
  <title>Annotations | Ideogram</title>
  <script type="text/javascript" src="ideogram.js"></script>
  <script src="/js/ideogramscript.js" defer></script>
  <script src="/js/relatedgenescript.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ideogram@1.39.0/dist/js/ideogram.min.js"></script>
  <link rel="stylesheet" href="/css/ideogramstyles.css">
  <link rel="icon" type="image/x-icon" href="img/ideogram_favicon.ico">
</head>
<body>
  <h1>Ideogram Annotations</h1>

  <p>
      <p id="assembly-options">
        <span>Assembly</span>
        <input type="radio" name="asm" id="GRCh38" value="GRCh38" checked>
        <label for="GRCh38">GRCh38</label>
        <input type="radio" name="asm" id="GRCh37" value="GRCh37">
        <label for="GRCh37">GRCh37</label>
      </p>
      <br/>
      <div style="clear: both;">
        <label for="bed-url">BED URL:</label>
        <input id="bed-url" type="text" style="width:300px">
        <button id="display-bed-link">Display BED</button>
      </div>
      <form name="uploadForm"> 
        <label for="bed-file">Upload a BED File:</label>
        <input type="file" id="uploadInput" name="bed-file" accept=".bed,.txt" />
        <button id="display-bed-upload">Display BED</button>
      </form>

      <label for="gene">Choose a gene to display related annotations:</label>

      <select name="gene" id="gene" onchange="getGeneSelectedValue()">
        <option value="CLPB">CLPB</option>
        <option value="RCL1">RCL1</option>
        <option value="B3GALT2">B3GALT2</option>
        <option value="CHMP6">CHMP6</option>
        <option value="ZNF669">ZNF669</option>
      </select>

  </p>


  <p id="annotations-summary">
  <div class="ideogram-display">
    <div id="ideo-container"></div> <!--style="height:400px"-->
  </div>
  <br/><br/>

  <p id="annotation-options">
    <span>Annotation Options:</span>
    <input type="radio" name="anno" id="Overlaid" value="overlay" checked>
    <label for="Overlaid">Overlaid</label>
    <input type="radio" name="anno" id="Triangle" value="tracks">
    <label for="Triangle">Triangle</label>
    <input type="radio" name="anno" id="Histogram" value="histogram">
    <label for="Triangle">Histogram</label>
    <br/>
    <span>Orientation Options:</span>
    <input type="radio" name="orient" id="Vertical" value="vertical">
    <label for="Triangle">Vertical</label>
    <input type="radio" name="orient" id="Horizontal" value="horizontal">
    <label for="Triangle">Horizontal</label>
    <button id="update-annotations">Update</button>
    <br>
    <button id="generate-heatmap">Generate Heatmap</button>
    <button id="generate-detail">Generate Detailed Annotations</button>
  </p>  
  <br/><br/>
  <div class="ideogram-display-two">
    <div id="ideo-container-two"></div> <!--style="height:400px"-->
  </div>

  <!--Related Genes Code-->
  <div class="control-container">
    <select id="organism-menu">
      <optgroup label="Model organisms">
        <option value="homo-sapiens" selected>Human (Homo sapiens)</option>
        <!-- <option value="tupaia-belangeri" selected>Tree shrew (Tupaia belangeri)</option> -->
        <option value="mus-musculus">Mouse (Mus musculus)</option>
        <option value="rattus-norvegicus">Rat (Rattus norvegicus)</option>
        <option value="drosophila-melanogaster">Fly (Drosophila melanogaster)</option>
        <option value="caenorhabditis-elegans">Worm (Caenorhabditis elegans)</option>
        <option value="danio-rerio">Zebrafish (Danio rerio)</option>
        <option value="arabidopsis-thaliana">Thale cress (Arabidopsis thaliana)</option>
        <!-- <option value="saccharomyces-cerevisiae">Yeast (Saccharomyces cerevisiae)</option> -->
      </optgroup>
      <optgroup label="Vertebrates">
        <option value="pan-troglodytes">Chimpanzee (Pan troglodytes)</option>
        <option value="macaca-mulatta">Macaque (Macaca mulatta)</option>
        <option value="macaca-fascicularis">Crab-eating macaque (Macaca fascicularis)</option>
        <option value="felis-catus">Cat (Felis catus)</option>
        <option value="canis-lupus-familiaris">Dog (Canis lupus familiaris)</option>
        <option value="equus-caballus">Horse (Equus caballus)</option>
        <option value="bos-taurus">Cow (Bos taurus)</option>
        <option value="sus-scrofa">Pig (Sus scrofa)</option>
        <!-- <option value="petromyzon-marinus">Lamprey (Petromyzon marinus)</option> -->
      </optgroup>
      <!--
      <optgroup label="Plants">
        <option value="zea-mays">Maize (Zea mays)</option>
        <option value="oryza-sativa">Rice (Oryza sativa)</option>
        <option value="solanum-lycopersicum">Tomato (Solanum lycopersicum)</option>
        <option value="musa-acuminata">Banana (Musa acuminata)</option>
        <option value="vitis-vinifera">Grape (Vitis vinifera)</option>
        <option value="micromonas-commoda">Green algae (Micromonas commoda)</option>
      </optgroup>
      <optgroup label="Insects">
        <option value="anopheles-gambiae">Mosquito (Anopheles gambiae)</option>
      </optgroup>
      <optgroup label="Protozoa">
        <option value="plasmodium-falciparum">Malaria parasite (Plasmodium falciparum)</option>
        <option value="leishmania-donovani">Leishmania parasite (Leishmania donovani)</option>
      </optgroup>
      -->
    </select>
  <div style="float: left; width: 350px;">
    <label for="search-genes" id="search-container">
      <input id="search-genes" autocomplete="off" placeholder="Search gene"/>
      <span id="search-button">
        <svg width="12" height="13"><g stroke-width="2" stroke="#FFF" fill="none"><path d="M11.29 11.71l-4-4"/><circle cx="5" cy="5" r="4"/></g></svg>
      </span>
      <div id="examples" style="font-size: 12px"></div>
    </label>
  </div>
</div>
<br/><br/><br/>
<!--<div class="wrapper">
  <div id="ideogram-container-related" style="visibility: hidden;"></div>
</div>-->


</body>
</html>
