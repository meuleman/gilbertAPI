[program:uwsgi]
directory = /data/narrativeGenomics/NarrativeGenomics/region_narration/region_narration_app/region-narration-flask
command = bash -c "/data/narrativeGenomics/ngenv/bin/uwsgi --buffer-size=32768 --ini /data/narrativeGenomics/NarrativeGenomics/region_narration/region_narration_app/region-narration-flask/region-narration.ini"

[program:nginx]
